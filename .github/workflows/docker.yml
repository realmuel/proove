name: Docker

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version = 0.1.<run number>; written to the add-on config so HA sees an update.
      - id: ver
        run: |
          v="0.1.${{ github.run_number }}"
          sed -i "s/^version: .*/version: \"$v\"/" proove/config.yaml
          echo "v=$v" >> "$GITHUB_OUTPUT"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "Release $v [skip ci]"
          git push
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ steps.ver.outputs.v }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
